<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
.logo{display:flex;gap:36px;margin-bottom:32px}
.logo span{font-size:42px;font-weight:300;color:#000;animation:f 0.6s ease-out both}
.logo span:nth-child(1){animation-delay:0s}
.logo span:nth-child(2){animation-delay:.05s}
.logo span:nth-child(3){animation-delay:.10s}
.logo span:nth-child(4){animation-delay:.15s}
.logo span:nth-child(5){animation-delay:.20s}
.logo span:nth-child(6){animation-delay:.25s}
.logo span:nth-child(7){animation-delay:.30s}
.logo span:nth-child(8){animation-delay:.35s}
.logo span:nth-child(9){animation-delay:.40s}
@keyframes f{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.icon{width:160px;height:160px;animation:spin 4s linear infinite;margin-bottom:40px}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar-track{position:relative;width:clamp(140px,28vw,360px);height:3px;background:rgba(0,0,0,0.06);border-radius:3px;overflow:hidden}
.pbar-fill{position:absolute;top:0;height:100%;background:#006c4a;border-radius:3px;width:30%;animation:load 1.6s linear infinite}
@keyframes load{0%{left:-30%}100%{left:100%}}
</style>
</head>
<body>
<div class="logo"><span>B</span><span>E</span><span>T</span><span>T</span><span>E</span><span>R</span><span>C</span><span>P</span><span>T</span></div>
<img src="load_icon.png" class="icon" alt="Loading">
<div class="pbar-track"><div class="pbar-fill"></div></div>
</body>
</html>
