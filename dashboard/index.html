<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterCPT Dashboard</title>
    <style>
      #loading-screen {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #fff;
        z-index: 9999;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #loading-screen img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }
      #loading-screen .logo { display: flex; gap: 28px; margin-bottom: 24px; }
      #loading-screen .logo span {
        font-size: 52px; font-weight: 300; color: #006c4a;
        animation: bccFadeIn 0.6s ease-out both;
      }
      #loading-screen .logo span:nth-child(1) { animation-delay: 0.00s; }
      #loading-screen .logo span:nth-child(2) { animation-delay: 0.05s; }
      #loading-screen .logo span:nth-child(3) { animation-delay: 0.10s; }
      #loading-screen .logo span:nth-child(4) { animation-delay: 0.15s; }
      #loading-screen .logo span:nth-child(5) { animation-delay: 0.20s; }
      #loading-screen .logo span:nth-child(6) { animation-delay: 0.25s; }
      #loading-screen .logo span:nth-child(7) { animation-delay: 0.30s; }
      #loading-screen .logo span:nth-child(8) { animation-delay: 0.35s; }
      #loading-screen .logo span:nth-child(9) { animation-delay: 0.40s; }
      @keyframes bccFadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      #loading-screen .icon {
        width: 120px; height: 120px;
        animation: bccSpin 4s linear infinite;
        margin-bottom: 28px;
      }
      @keyframes bccSpin { to { transform: rotate(360deg); } }
      #loading-screen .pbar-track {
        position: relative;
        width: 280px;
        height: 3px;
        background: rgba(0,0,0,0.06);
        border-radius: 3px;
        overflow: hidden;
      }
      #loading-screen .pbar-fill {
        position: absolute;
        top: 0; height: 100%;
        background: #006c4a;
        border-radius: 3px;
        width: 30%;
        animation: bccLoad 1.5s linear infinite;
      }
      @keyframes bccLoad {
        0%   { left: -30%; }
        100% { left: 100%; }
      }
      #loading-screen .loading-text {
        font-size: 12px; font-weight: 400; color: #006c4a;
        margin-top: 16px;
        animation: bccFadeIn 0.6s ease-out both;
        animation-delay: 0.50s;
      }
      #loading-screen .version {
        position: absolute; bottom: 24px; left: 28px;
        font-size: 12px; font-weight: 400;
        color: rgba(0,0,0,0.25);
      }
      @keyframes bccFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-24px); }
      }
    </style>
    <script>
      // 页面开始渲染时立即显示窗口，避免 WebView2 白屏闪烁
      if (window.__TAURI__) {
        window.__TAURI__.core.invoke('show_dashboard').catch(function(){});
      }
      window.__bccLoadStart = Date.now();
      window.__bccRemoveLoading = function() {
        var el = document.getElementById('loading-screen');
        if (!el) return;
        var elapsed = Date.now() - (window.__bccLoadStart || 0);
        var minRemain = Math.max(1000 - elapsed, 0);
        setTimeout(function() {
          el.style.opacity = '0'; el.style.transition = 'opacity 0.3s';
          setTimeout(function() {
            el.remove();
            // 通知 Host：Dashboard 就绪，可以启动插件
            if (window.__TAURI__) {
              window.__TAURI__.core.invoke('dashboard_ready').catch(function(){});
            }
          }, 300);
        }, minRemain);
      };
    </script>
  </head>
  <body class="bg-background text-on-surface">
    <div id="loading-screen">
      <span class="material-symbols-outlined" style="position:absolute;top:24%;left:18%;font-size:44px;color:rgba(0,108,74,0.18);animation:bccFloat 5s ease-in-out infinite">extension</span>
      <span class="material-symbols-outlined" style="position:absolute;top:28%;right:22%;font-size:38px;color:rgba(76,100,87,0.16);animation:bccFloat 4.5s ease-in-out 0.3s infinite">widgets</span>
      <span class="material-symbols-outlined" style="position:absolute;top:54%;left:22%;font-size:46px;color:rgba(136,82,21,0.16);animation:bccFloat 5.5s ease-in-out 0.7s infinite">terminal</span>
      <span class="material-symbols-outlined" style="position:absolute;top:48%;right:18%;font-size:40px;color:rgba(0,108,74,0.17);animation:bccFloat 4.8s ease-in-out 1s infinite">star</span>
      <span class="material-symbols-outlined" style="position:absolute;top:62%;left:26%;font-size:36px;color:rgba(76,100,87,0.17);animation:bccFloat 5.2s ease-in-out 0.5s infinite">code</span>
      <span class="material-symbols-outlined" style="position:absolute;top:22%;right:35%;font-size:32px;color:rgba(136,82,21,0.15);animation:bccFloat 4.3s ease-in-out 1.2s infinite">palette</span>
      <span class="material-symbols-outlined" style="position:absolute;top:58%;right:28%;font-size:42px;color:rgba(0,108,74,0.16);animation:bccFloat 5.8s ease-in-out 0.8s infinite">memory</span>
      <span class="material-symbols-outlined" style="position:absolute;top:35%;left:32%;font-size:32px;color:rgba(76,100,87,0.16);animation:bccFloat 4s ease-in-out 1.5s infinite">hub</span>
      <span class="material-symbols-outlined" style="position:absolute;top:40%;right:32%;font-size:36px;color:rgba(136,82,21,0.15);animation:bccFloat 5.3s ease-in-out 0.4s infinite">settings</span>
      <span class="material-symbols-outlined" style="position:absolute;top:32%;left:25%;font-size:34px;color:rgba(0,108,74,0.17);animation:bccFloat 4.6s ease-in-out 1.1s infinite">token</span>
      <span class="material-symbols-outlined" style="position:absolute;top:50%;left:16%;font-size:42px;color:rgba(76,100,87,0.16);animation:bccFloat 5.1s ease-in-out 0.6s infinite">cloud</span>
      <span class="material-symbols-outlined" style="position:absolute;top:65%;right:22%;font-size:38px;color:rgba(0,108,74,0.16);animation:bccFloat 4.7s ease-in-out 0.9s infinite">layers</span>
      <span class="material-symbols-outlined" style="position:absolute;top:70%;left:30%;font-size:30px;color:rgba(136,82,21,0.15);animation:bccFloat 5.4s ease-in-out 1.3s infinite">data_object</span>
      <span class="material-symbols-outlined" style="position:absolute;top:30%;right:28%;font-size:36px;color:rgba(0,108,74,0.16);animation:bccFloat 4.2s ease-in-out 0.2s infinite">dock</span>
      <div class="logo">
        <span>B</span><span>E</span><span>T</span><span>T</span><span>E</span><span>R</span><span>C</span><span>P</span><span>T</span>
      </div>
      <img src="load_icon.png" class="icon" alt="Loading">
      <div class="pbar-track"><div class="pbar-fill"></div></div>
      <div class="loading-text">Loading...</div>
      <div class="version">v1.0.0</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
